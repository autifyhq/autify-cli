name: E2E tests

on:
  workflow_call:
    secrets:
      AUTIFY_CLI_E2E_AUTIFY_MOBILE_ACCESS_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  tarball:
    strategy:
      matrix:
        include:
          # Pinned to macOS 15. On the macOS 26 image the app download outruns
          # bsdtar, and appium-xcuitest-driver 8.4.3 registers no error listener
          # on its stdin, so the resulting EPIPE becomes an uncaught exception
          # and kills the Appium server mid-session. Safe to move back to
          # macos-latest-xlarge once mobilelink ships a driver that handles it.
          - target: darwin-arm64
            os: macos-15-xlarge
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/install
        with:
          target: ${{ matrix.target }}
      - run: npm run test:e2e
        env:
          AUTIFY_CLI_E2E_AUTIFY_MOBILE_ACCESS_TOKEN: ${{ secrets.AUTIFY_CLI_E2E_AUTIFY_MOBILE_ACCESS_TOKEN }}

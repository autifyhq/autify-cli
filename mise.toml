[tools]
node = "22"
# The lockfile records no backend for npm on purpose: mise applies a locked
# backend to every platform, and aqua has no Windows build while npm:npm leaves
# node's npm 10 on PATH on unix. Letting the registry choose gets npm 11 (which
# min-release-age needs) everywhere. Don't let a re-lock add that line back.
npm = "11.19.0"

[settings]
locked = true
jobs = 1
